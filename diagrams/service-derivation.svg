<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" width="1120" height="700" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="d-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b6ea5"/>
    </marker>
    <marker id="d-arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a03d3d"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1120" height="700" fill="#f7f8fa"/>

  <text x="40" y="52" font-size="25" font-weight="600" fill="#1b2430">One contract, two sources, five consumers</text>
  <text x="40" y="78" font-size="14.5" fill="#5a6675">A service is declared once. Everything that needs to know about it is derived — and no renderer ever reads inventory directly.</text>

  <!-- declaration -->
  <rect x="40" y="130" width="290" height="176" rx="7" fill="#ffffff" stroke="#3b6ea5" stroke-width="2.2"/>
  <text x="60" y="160" font-size="15" font-weight="600" fill="#1b2430">The declaration</text>
  <text x="60" y="180" font-size="12.5" fill="#5a6675">inventory/host_vars/&lt;host&gt;.yml</text>
  <rect x="60" y="196" width="250" height="92" rx="5" fill="#f3f6f9" stroke="#cfd8e3"/>
  <g font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#3f4a59">
    <text x="74" y="214">services:</text>
    <text x="74" y="230">  - name: docs</text>
    <text x="74" y="246">    dns_name: docs</text>
    <text x="74" y="262">    port: 6875</text>
    <text x="74" y="278">    auth: forward</text>
  </g>

  <rect x="40" y="322" width="290" height="86" rx="7" fill="#ffffff" stroke="#b5713a" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="60" y="348" font-size="14" font-weight="600" fill="#1b2430">Services that are not hosts</text>
  <text x="60" y="368" font-size="12.5" fill="#5a6675">Hypervisor UIs, switch controller, firewall.</text>
  <text x="60" y="386" font-size="12.5" fill="#5a6675">Same fields; they state their own address.</text>
  <path d="M 330 360 C 366 360, 366 236, 404 236" stroke="#b5713a" stroke-width="2.2" fill="none" marker-end="url(#d-arrow)"/>

  <!-- contract role -->
  <rect x="404" y="168" width="180" height="84" rx="7" fill="#1b2430"/>
  <text x="494" y="202" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">contract role</text>
  <text x="494" y="224" text-anchor="middle" font-size="12" fill="#b9c4d1">derives, never reconciles</text>
  <path d="M 330 210 L 404 210" stroke="#3b6ea5" stroke-width="2.2" fill="none" marker-end="url(#d-arrow)"/>

  <!-- four consumers -->
  <g>
    <rect x="676" y="112" width="404" height="58" rx="6" fill="#ffffff" stroke="#3b6ea5" stroke-width="1.6"/>
    <text x="696" y="138" font-size="14" font-weight="600" fill="#1b2430">Reverse-proxy route</text>
    <text x="696" y="157" font-size="12.5" fill="#5a6675">a name under the wildcard, on the one site block</text>

    <rect x="676" y="182" width="404" height="58" rx="6" fill="#ffffff" stroke="#3b6ea5" stroke-width="1.6"/>
    <text x="696" y="208" font-size="14" font-weight="600" fill="#1b2430">Forward-auth policy</text>
    <text x="696" y="227" font-size="12.5" fill="#5a6675">auth mode per service — unknown values fail the run</text>

    <rect x="676" y="252" width="404" height="58" rx="6" fill="#ffffff" stroke="#3b6ea5" stroke-width="1.6"/>
    <text x="696" y="278" font-size="14" font-weight="600" fill="#1b2430">Dashboard card</text>
    <text x="696" y="297" font-size="12.5" fill="#5a6675">group, icon and description — no credential</text>

    <rect x="676" y="322" width="404" height="58" rx="6" fill="#ffffff" stroke="#3b6ea5" stroke-width="1.6"/>
    <text x="696" y="348" font-size="14" font-weight="600" fill="#1b2430">Uptime check</text>
    <text x="696" y="367" font-size="12.5" fill="#5a6675">expected status derived from the auth mode</text>

    <rect x="676" y="392" width="404" height="58" rx="6" fill="#ffffff" stroke="#3b6ea5" stroke-width="1.6"/>
    <text x="696" y="418" font-size="14" font-weight="600" fill="#1b2430">Metric and probe targets</text>
    <text x="696" y="437" font-size="12.5" fill="#5a6675">scrape target and blackbox probe</text>
  </g>
  <path d="M 584 196 C 630 196, 630 141, 676 141" stroke="#3b6ea5" stroke-width="2" fill="none" marker-end="url(#d-arrow)"/>
  <path d="M 584 205 C 630 205, 630 211, 676 211" stroke="#3b6ea5" stroke-width="2" fill="none" marker-end="url(#d-arrow)"/>
  <path d="M 584 220 C 630 220, 630 281, 676 281" stroke="#3b6ea5" stroke-width="2" fill="none" marker-end="url(#d-arrow)"/>
  <path d="M 584 232 C 630 232, 630 351, 676 351" stroke="#3b6ea5" stroke-width="2" fill="none" marker-end="url(#d-arrow)"/>
  <path d="M 584 240 C 630 240, 630 421, 676 421" stroke="#3b6ea5" stroke-width="2" fill="none" marker-end="url(#d-arrow)"/>

  <!-- deletion -->
  <line x1="40" y1="490" x2="1080" y2="490" stroke="#e2e6ec" stroke-width="1.4"/>
  <text x="40" y="522" font-size="16" font-weight="600" fill="#1b2430">Deleting the declaration</text>

  <rect x="40" y="540" width="500" height="102" rx="7" fill="#ffffff" stroke="#3b6ea5" stroke-width="1.6"/>
  <text x="60" y="566" font-size="14" font-weight="600" fill="#3b6ea5">Drops by itself</text>
  <text x="60" y="588" font-size="12.5" fill="#5a6675">The proxy route · the dashboard card · the uptime check ·</text>
  <text x="60" y="606" font-size="12.5" fill="#5a6675">the metric and probe targets.</text>
  <text x="60" y="628" font-size="12.5" fill="#5a6675">Four consumers removed by one deleted entry.</text>

  <rect x="580" y="540" width="500" height="102" rx="7" fill="#ffffff" stroke="#a03d3d" stroke-width="1.6"/>
  <text x="600" y="566" font-size="14" font-weight="600" fill="#a03d3d">Does not</text>
  <text x="600" y="588" font-size="12.5" fill="#5a6675">The intrusion-detection agent registration — nothing derives it,</text>
  <text x="600" y="606" font-size="12.5" fill="#5a6675">so it persists and shows as broken rather than absent.</text>
  <text x="600" y="628" font-size="12.5" fill="#5a6675">Host-key entries. Backup archives, which outlive the guest.</text>
  <path d="M 556 591 L 578 591" stroke="#a03d3d" stroke-width="2" fill="none" marker-end="url(#d-arrowRed)"/>
</svg>
