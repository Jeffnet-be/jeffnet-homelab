<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" width="1120" height="660" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="p-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b6ea5"/>
    </marker>
    <marker id="p-copper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b5713a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1120" height="660" fill="#f7f8fa"/>

  <text x="40" y="52" font-size="25" font-weight="600" fill="#1b2430">Many detectors, one pager</text>
  <text x="40" y="78" font-size="14.5" fill="#5a6675">Every detector ends in one chat, outside the estate. Scheduled work is watched for failure, for silence and for drift.</text>

  <!-- detectors -->
  <g font-size="13.5">
    <rect x="40" y="118" width="270" height="46" rx="6" fill="#ffffff" stroke="#3b6ea5" stroke-width="1.6"/>
    <text x="60" y="146" font-weight="600" fill="#1b2430">Metrics alerting</text>
    <rect x="40" y="176" width="270" height="46" rx="6" fill="#ffffff" stroke="#3b6ea5" stroke-width="1.6"/>
    <text x="60" y="204" font-weight="600" fill="#1b2430">Uptime checks</text>
    <rect x="40" y="234" width="270" height="46" rx="6" fill="#ffffff" stroke="#3b6ea5" stroke-width="1.6"/>
    <text x="60" y="262" font-weight="600" fill="#1b2430">Hypervisor notifications</text>
    <rect x="40" y="292" width="270" height="46" rx="6" fill="#ffffff" stroke="#3b6ea5" stroke-width="1.6"/>
    <text x="60" y="320" font-weight="600" fill="#1b2430">Network monitoring</text>
    <rect x="40" y="350" width="270" height="46" rx="6" fill="#ffffff" stroke="#3b6ea5" stroke-width="1.6"/>
    <text x="60" y="378" font-weight="600" fill="#1b2430">Intrusion detection</text>
    <text x="206" y="378" font-size="12" fill="#5a6675">above a severity</text>

    <rect x="40" y="436" width="270" height="46" rx="6" fill="#ffffff" stroke="#b5713a" stroke-width="1.6"/>
    <text x="60" y="464" font-weight="600" fill="#1b2430">Scheduled plays</text>
    <text x="186" y="464" font-size="12" fill="#5a6675">nightly, check mode</text>
  </g>
  <text x="40" y="504" font-size="12.5" fill="#5a6675">Each path proven end to end - some by a real fault, the rest by a deliberate test.</text>

  <!-- delivery rules -->
  <rect x="384" y="118" width="214" height="278" rx="7" fill="#ffffff" stroke="#3b6ea5" stroke-width="1.8"/>
  <text x="491" y="146" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2430">Delivery rules</text>
  <g font-size="12.5" fill="#5a6675">
    <text x="491" y="176" text-anchor="middle">the uptime checker has its</text>
    <text x="491" y="196" text-anchor="middle">own dead-man heartbeat:</text>
    <text x="491" y="216" text-anchor="middle">a silent watcher still pages</text>
    <text x="491" y="252" text-anchor="middle" fill="#3b6ea5">one message per finding,</text>
    <text x="491" y="272" text-anchor="middle" fill="#3b6ea5">not one per host that sees it</text>
    <text x="491" y="308" text-anchor="middle">hosted outside the estate:</text>
    <text x="491" y="328" text-anchor="middle">the pager shares no failure</text>
    <text x="491" y="348" text-anchor="middle">domain with what it reports</text>
  </g>
  <g stroke="#3b6ea5" stroke-width="2" fill="none">
    <path d="M 310 141 L 384 168" marker-end="url(#p-arrow)"/>
    <path d="M 310 199 L 384 212" marker-end="url(#p-arrow)"/>
    <path d="M 310 257 L 384 257" marker-end="url(#p-arrow)"/>
    <path d="M 310 315 L 384 302" marker-end="url(#p-arrow)"/>
    <path d="M 310 373 L 384 346" marker-end="url(#p-arrow)"/>
  </g>

  <!-- heartbeat -->
  <rect x="384" y="420" width="214" height="78" rx="7" fill="#ffffff" stroke="#b5713a" stroke-width="1.8"/>
  <text x="491" y="446" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2430">Heartbeat service</text>
  <text x="491" y="468" text-anchor="middle" font-size="12.5" fill="#b5713a">failure · silence · drift</text>
  <text x="491" y="486" text-anchor="middle" font-size="12" fill="#5a6675">two checks per job</text>
  <path d="M 310 459 L 384 459" stroke="#b5713a" stroke-width="2" fill="none" marker-end="url(#p-copper)"/>

  <!-- chat -->
  <rect x="672" y="196" width="196" height="120" rx="7" fill="#1b2430"/>
  <text x="770" y="242" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">One chat</text>
  <text x="770" y="266" text-anchor="middle" font-size="12.5" fill="#b9c4d1">one bot, hosted</text>
  <text x="770" y="286" text-anchor="middle" font-size="12.5" fill="#b9c4d1">messaging service</text>
  <path d="M 598 256 L 672 256" stroke="#3b6ea5" stroke-width="2.2" fill="none" marker-end="url(#p-arrow)"/>
  <path d="M 598 459 C 640 459, 640 300, 672 300" stroke="#b5713a" stroke-width="2.2" fill="none" marker-end="url(#p-copper)"/>

  <!-- phone -->
  <rect x="956" y="186" width="104" height="140" rx="12" fill="#ffffff" stroke="#3b6ea5" stroke-width="2.2"/>
  <rect x="972" y="206" width="72" height="92" rx="4" fill="#f3f6f9"/>
  <text x="1008" y="346" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1b2430">One phone</text>
  <path d="M 868 256 L 956 256" stroke="#3b6ea5" stroke-width="2.2" fill="none" marker-end="url(#p-arrow)"/>

  <line x1="40" y1="530" x2="1080" y2="530" stroke="#e2e6ec" stroke-width="1.4"/>
  <g font-size="13" fill="#5a6675">
    <text x="40" y="560" font-weight="600" fill="#1b2430">Why this shape.</text>
    <text x="40" y="584">Detection and delivery are separate facts. Every technical control here once worked perfectly while nobody was subscribed</text>
    <text x="40" y="604">on a device that interrupts - seven real alerts, and the outcome was identical to having no monitoring at all.</text>
    <text x="40" y="630" fill="#1b2430" font-weight="600">A control is finished when a person is interrupted, not when the notification is sent.</text>
    <text x="40" y="650">Silence is a failure too: a job that stops running sends nothing, so the heartbeat alerts on what does not arrive.</text>
  </g>
</svg>
