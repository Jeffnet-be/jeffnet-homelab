<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="p-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b6ea5"/>
    </marker>
    <marker id="p-copper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b5713a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1120" height="600" fill="#f7f8fa"/>

  <text x="40" y="52" font-size="25" font-weight="600" fill="#1b2430">Many detectors, one pager</text>
  <text x="40" y="78" font-size="14.5" fill="#5a6675">Each detector publishes with its own write-only identity. One subscription. One device that interrupts.</text>

  <!-- detectors -->
  <g font-size="13.5">
    <rect x="40" y="128" width="270" height="52" rx="6" fill="#ffffff" stroke="#3b6ea5" stroke-width="1.6"/>
    <text x="60" y="159" font-weight="600" fill="#1b2430">Metrics alerting</text>
    <rect x="40" y="196" width="270" height="52" rx="6" fill="#ffffff" stroke="#3b6ea5" stroke-width="1.6"/>
    <text x="60" y="227" font-weight="600" fill="#1b2430">Hypervisor notifications</text>
    <rect x="40" y="264" width="270" height="52" rx="6" fill="#ffffff" stroke="#3b6ea5" stroke-width="1.6"/>
    <text x="60" y="295" font-weight="600" fill="#1b2430">Network monitoring</text>
    <rect x="40" y="332" width="270" height="52" rx="6" fill="#ffffff" stroke="#3b6ea5" stroke-width="1.6"/>
    <text x="60" y="363" font-weight="600" fill="#1b2430">Scheduled plays</text>
  </g>
  <text x="40" y="410" font-size="12.5" fill="#5a6675">Each proven by a real fault, not a test message.</text>

  <!-- identities -->
  <rect x="384" y="128" width="196" height="256" rx="7" fill="#ffffff" stroke="#b5713a" stroke-width="1.8"/>
  <text x="482" y="156" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2430">One identity each</text>
  <g font-size="12.5" fill="#5a6675">
    <text x="482" y="184" text-anchor="middle">write-only token</text>
    <text x="482" y="206" text-anchor="middle">per publisher</text>
    <text x="482" y="240" text-anchor="middle" fill="#b5713a">subscriber: read-only</text>
    <text x="482" y="262" text-anchor="middle" fill="#b5713a">anonymous: deny-all</text>
    <text x="482" y="296" text-anchor="middle">a burned credential</text>
    <text x="482" y="316" text-anchor="middle">costs one publisher,</text>
    <text x="482" y="336" text-anchor="middle">never the channel</text>
  </g>
  <g stroke="#3b6ea5" stroke-width="2" fill="none">
    <path d="M 310 154 L 384 168" marker-end="url(#p-arrow)"/>
    <path d="M 310 222 L 384 212" marker-end="url(#p-arrow)"/>
    <path d="M 310 290 L 384 268" marker-end="url(#p-arrow)"/>
    <path d="M 310 358 L 384 312" marker-end="url(#p-arrow)"/>
  </g>

  <!-- topic -->
  <rect x="656" y="196" width="196" height="120" rx="7" fill="#1b2430"/>
  <text x="754" y="242" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">One topic</text>
  <text x="754" y="266" text-anchor="middle" font-size="12.5" fill="#b9c4d1">self-hosted push</text>
  <text x="754" y="286" text-anchor="middle" font-size="12.5" fill="#b9c4d1">service</text>
  <path d="M 580 256 L 656 256" stroke="#b5713a" stroke-width="2.2" fill="none" marker-end="url(#p-copper)"/>

  <!-- phone -->
  <rect x="944" y="186" width="104" height="140" rx="12" fill="#ffffff" stroke="#3b6ea5" stroke-width="2.2"/>
  <rect x="960" y="206" width="72" height="92" rx="4" fill="#f3f6f9"/>
  <text x="996" y="346" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1b2430">One phone</text>
  <path d="M 852 256 L 944 256" stroke="#3b6ea5" stroke-width="2.2" fill="none" marker-end="url(#p-arrow)"/>

  <line x1="40" y1="452" x2="1080" y2="452" stroke="#e2e6ec" stroke-width="1.4"/>
  <g font-size="13" fill="#5a6675">
    <text x="40" y="482" font-weight="600" fill="#1b2430">Why this shape.</text>
    <text x="40" y="506">Detection and delivery are separate facts. Every technical control here once worked perfectly while nobody was subscribed</text>
    <text x="40" y="526">on a device that interrupts - seven real alerts, and the outcome was identical to having no monitoring at all.</text>
    <text x="40" y="552" fill="#1b2430" font-weight="600">A control is finished when a person is interrupted, not when the notification is sent.</text>
    <text x="40" y="576">Ask where the alert goes of every subsystem separately. Recording is not alerting.</text>
  </g>
</svg>
